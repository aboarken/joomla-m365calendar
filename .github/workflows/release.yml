name: Release

# Two ways to publish a release (the version must match <version> in
# src/pkg/pkg_m365calendar.xml and have a section in CHANGELOG.md):
# - push a tag such as v0.1.0, or
# - run this workflow on main from the Actions tab ("Run workflow") with the
#   version; it then creates the tag v<version> on that commit itself.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      # Tag pushes use the pushed tag; manual runs build v<version> from main.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring, zip
          coverage: none

      - name: Check that the tag matches the package version
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag $RELEASE_TAG"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main"
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          manifest_version="$(php -r 'echo (string) simplexml_load_file("src/pkg/pkg_m365calendar.xml")->version;')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the manifest version $manifest_version"
            exit 1
          fi
          grep -q "^## \[$tag_version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag_version"; exit 1; }

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit

      - name: Build package
        run: php build/build.php

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum pkg_m365calendar-*.zip > SHA256SUMS
          sha384sum pkg_m365calendar-*.zip > SHA384SUMS
          cat SHA256SUMS SHA384SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Install"
            echo "Download \`pkg_m365calendar-$version.zip\` below and install it in Joomla under System → Install → Extensions."
            echo
            echo "SHA-384 (for the update server): \`$(cut -d' ' -f1 dist/SHA384SUMS)\`"
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          prerelease=""
          # 0.x versions are published as pre-releases.
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Creates the tag on the commit this run built.
            target="--target $GITHUB_SHA"
          else
            target="--verify-tag"
          fi
          gh release create "$RELEASE_TAG" \
            "dist/pkg_m365calendar-$version.zip" dist/SHA256SUMS dist/SHA384SUMS \
            --title "Microsoft 365 Calendar $version" \
            --notes-file release-notes.md \
            $target $prerelease
